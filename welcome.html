<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tapliy — Welcome</title>
<!--
  ============================================================================
  Tapliy — set-password landing page for waitlist invite emails
  ============================================================================
  Reached only via the invite email sent by supabase/functions/
  invite-waitlist-entry (Admin > Approve & invite on dashboard/index.html).
  That function calls supabase.auth.admin.inviteUserByEmail() with
  redirectTo pointed here -- Supabase emails a link with an auth token in
  the URL, and supabase-js auto-detects + exchanges it for a session on
  page load (detectSessionInUrl, on by default), no manual parsing needed.

  Once a session exists, this page just lets them set a password via
  supabase.auth.updateUser(). After that they sign into the Tapliy app
  with that email + password like any other account (lib/store.js's
  existing signIn()) -- no app changes needed, this page is the entire
  new surface.

  This redirectTo URL must be added to Supabase → Auth → URL
  Configuration → Redirect URLs, same as the existing Google OAuth
  callback (see SETUP.md) -- Supabase rejects unlisted redirect URLs.
  ============================================================================
-->
<style>
  :root{
    --bg:#0A0A0B; --surface:#131316; --elevated:#1B1B1F;
    --text:#F4F3EF; --dim:#8B8B92; --faint:#5A5A60;
    --line:rgba(255,255,255,.08); --lineStrong:rgba(255,255,255,.16);
    --accent:#CBA45C; --accentHi:#E7C983; --danger:#E5574B; --success:#5BC08C;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 40px) 22px 40px;
    display:flex;flex-direction:column}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.35em;
    color:var(--faint);text-transform:uppercase;text-decoration:none;display:inline-block}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;
    color:var(--accent);text-transform:uppercase;margin:34px 0 10px}
  h1{font-size:28px;font-weight:600;margin:0 0 10px;line-height:1.2}
  .sub{color:var(--dim);font-size:15px;margin:0 0 24px;line-height:1.6}

  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .field{margin-bottom:18px}
  input{width:100%;background:var(--surface);border:1px solid var(--line);
    color:var(--text);font-size:16px;border-radius:14px;padding:15px 16px;outline:none;
    font-family:inherit}
  input:focus{border-color:var(--lineStrong)}
  input::placeholder{color:var(--faint)}
  button{width:100%;margin-top:10px;background:var(--text);color:#111;
    border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:600;
    cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:18px;font-size:14px;line-height:1.5;display:none}
  .msg.err{display:block;color:var(--danger)}
  .foot{margin-top:auto;padding-top:36px;color:var(--faint);
    font-family:var(--mono);font-size:11px;letter-spacing:.25em;text-transform:uppercase;text-align:center}

  .center{display:flex;flex:1;align-items:center;justify-content:center;
    color:var(--dim);text-align:center;padding:0 10px}

  /* success state */
  .done{display:none;text-align:center;padding-top:60px}
  .done.show{display:block}
  .tick{width:66px;height:66px;border-radius:50%;margin:0 auto 22px;
    border:1px solid var(--success);display:flex;align-items:center;justify-content:center;
    color:var(--success);font-size:30px}
</style>
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="brand">Tapliy</a>

    <!-- loading / expired-link state -->
    <div id="loading" class="center">Confirming your invite…</div>

    <!-- set-password form -->
    <form id="form" style="display:none">
      <div class="eyebrow">Early access</div>
      <h1>Welcome to Tapliy</h1>
      <p class="sub" id="greet">Set a password to finish creating your account. You'll use it to sign into the Tapliy app.</p>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8" />
      </div>

      <button id="submit" type="submit">Set password</button>
      <div id="err" class="msg"></div>
    </form>

    <div id="done" class="done">
      <div class="tick">✓</div>
      <h1>You're all set</h1>
      <p class="sub">Open the Tapliy app and sign in with <span id="doneEmail">your email</span> and the password you just set.</p>
    </div>

    <div class="foot">Powered by Tapliy</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL  = "https://idoxkgzcamqvknnbnbbp.supabase.co";
    const SUPABASE_ANON  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlkb3hrZ3pjYW1xdmtubmJuYmJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NDY0ODUsImV4cCI6MjEwMjEyMjQ4NX0.AD-viN1J9hM9sG0a4Mq8DNcO5YqhMhFhIrOmcHFcEU0";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const $ = (id) => document.getElementById(id);

    function showErr(text){
      $("err").textContent = text;
      $("err").className = "msg err";
    }

    function expired(){
      $("loading").textContent = "This invite link has expired or was already used. Ask Tapliy for a fresh one.";
    }

    async function init(){
      // supabase-js parses the invite token out of the URL and exchanges it
      // for a session automatically on client creation -- just wait for
      // that to land (or time out if the link is stale/already used).
      const { data } = await sb.auth.getSession();
      if(!data.session){
        setTimeout(expired, 2500);
        return;
      }
      const email = data.session.user.email;
      const name = data.session.user.user_metadata?.name;
      $("greet").textContent = (name ? `Hi ${name.split(" ")[0]}, set` : "Set") +
        " a password to finish creating your account. You'll use it to sign into the Tapliy app.";
      $("doneEmail").textContent = email || "your email";
      $("loading").style.display = "none";
      $("form").style.display = "block";
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("err").className = "msg";
      const password = $("password").value;
      if(password.length < 8){ return; }

      $("submit").disabled = true;
      $("submit").textContent = "Please wait…";

      const { error } = await sb.auth.updateUser({ password });

      if(error){
        showErr("Something went wrong. Please try again.");
        $("submit").disabled = false;
        $("submit").textContent = "Set password";
        return;
      }

      $("form").style.display = "none";
      $("done").classList.add("show");
    });

    init();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tapliy — Early access waitlist</title>
<!--
  ============================================================================
  Tapliy — early access waitlist
  ============================================================================
  Landing spot for every "Choose this plan" button (plans.html, index.html)
  and the lead-discount email's link, while Tapliy is in early access --
  order.html/create-checkout-session (real Stripe checkout) are untouched and
  fully working, just not linked to from anywhere right now. Swapping the
  button hrefs back to order.html?plan=X&billing=Y is the whole "go live"
  step whenever early access ends.

  Optional ?plan=&billing=&ref= params (ref = the cardholder's username, if
  they arrived via a lead email) are shown/stored for context but never
  required -- this page never redirects, unlike order.html.
  ============================================================================
-->
<style>
  :root{
    --bg:#0A0A0B; --surface:#131316; --elevated:#1B1B1F;
    --text:#F4F3EF; --dim:#8B8B92; --faint:#5A5A60;
    --line:rgba(255,255,255,.08); --lineStrong:rgba(255,255,255,.16);
    --accent:#CBA45C; --accentHi:#E7C983; --danger:#E5574B; --success:#5BC08C;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 40px) 22px 40px;
    display:flex;flex-direction:column}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.35em;
    color:var(--faint);text-transform:uppercase}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;
    color:var(--accent);text-transform:uppercase;margin:34px 0 10px}
  h1{font-size:28px;font-weight:600;margin:0 0 10px;line-height:1.2}
  .sub{color:var(--dim);font-size:15px;margin:0 0 24px;line-height:1.6}

  .planPill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:8px 16px;
    font-size:13px;color:var(--dim);margin-bottom:28px}
  .planPill b{color:var(--text);font-weight:600}

  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .field{margin-bottom:18px}
  input{width:100%;background:var(--surface);border:1px solid var(--line);
    color:var(--text);font-size:16px;border-radius:14px;padding:15px 16px;outline:none;
    font-family:inherit}
  input:focus{border-color:var(--lineStrong)}
  input::placeholder{color:var(--faint)}
  button{width:100%;margin-top:10px;background:var(--text);color:#111;
    border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:600;
    cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:18px;font-size:14px;line-height:1.5;display:none}
  .msg.err{display:block;color:var(--danger)}
  .foot{margin-top:auto;padding-top:36px;color:var(--faint);
    font-family:var(--mono);font-size:11px;letter-spacing:.25em;text-transform:uppercase;text-align:center}

  /* success state */
  .done{display:none;text-align:center;padding-top:60px}
  .done.show{display:block}
  .tick{width:66px;height:66px;border-radius:50%;margin:0 auto 22px;
    border:1px solid var(--success);display:flex;align-items:center;justify-content:center;
    color:var(--success);font-size:30px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Tapliy</div>

    <form id="form">
      <div class="eyebrow">Early access</div>
      <h1>Join the waitlist</h1>
      <p class="sub">We're opening Tapliy in phases. Pop your details in and we'll email you the moment early access opens.</p>

      <div class="planPill" id="planPill" style="display:none">Interested in: <b id="planPillText"></b></div>

      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" autocomplete="name" placeholder="Your full name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
      </div>

      <button id="submit" type="submit">Join the waitlist</button>
      <div id="err" class="msg"></div>
    </form>

    <div id="done" class="done">
      <div class="tick">✓</div>
      <h1>You're on the list</h1>
      <p class="sub">We'll email you as soon as early access opens.</p>
    </div>

    <div class="foot">Powered by Tapliy</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL  = "https://idoxkgzcamqvknnbnbbp.supabase.co";
    const SUPABASE_ANON  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlkb3hrZ3pjYW1xdmtubmJuYmJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NDY0ODUsImV4cCI6MjEwMjEyMjQ4NX0.AD-viN1J9hM9sG0a4Mq8DNcO5YqhMhFhIrOmcHFcEU0";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const plan = params.get("plan");
    const billing = params.get("billing");
    const ref = params.get("ref");

    const PLAN_NAMES = { basic: "Basic", professional: "Professional", premium: "Premium" };
    if(PLAN_NAMES[plan]){
      const billingLabel = billing === "annual" ? "Annual" : "Monthly";
      $("planPillText").textContent = `${PLAN_NAMES[plan]} (${billingLabel})`;
      $("planPill").style.display = "inline-flex";
    }

    function showErr(text){
      $("err").textContent = text;
      $("err").className = "msg err";
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("err").className = "msg";
      const name = $("name").value.trim();
      const email = $("email").value.trim();
      if(!name || !email){ return; }

      $("submit").disabled = true;
      $("submit").textContent = "Please wait…";

      const { error } = await sb.rpc("join_waitlist", {
        p_name: name,
        p_email: email,
        p_plan: plan,
        p_billing: billing,
        p_referred_by: ref,
      });

      if(error){
        showErr("Something went wrong. Please try again.");
        $("submit").disabled = false;
        $("submit").textContent = "Join the waitlist";
        return;
      }

      $("form").style.display = "none";
      $("done").classList.add("show");
    });
  </script>
</body>
</html>

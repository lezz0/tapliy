<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tapliy — Connect</title>
<style>
  :root{
    --bg:#0A0A0B; --surface:#131316; --elevated:#1B1B1F;
    --text:#F4F3EF; --dim:#8B8B92; --faint:#5A5A60;
    --line:rgba(255,255,255,.08); --lineStrong:rgba(255,255,255,.16);
    --accent:#CBA45C; --accentHi:#E7C983; --danger:#E5574B; --success:#5BC08C;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 40px) 22px 40px;
    display:flex;flex-direction:column}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.35em;
    color:var(--faint);text-transform:uppercase;text-decoration:none;display:inline-block}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;
    color:var(--accent);text-transform:uppercase;margin:34px 0 10px}
  h1{font-size:26px;font-weight:600;margin:0 0 6px;line-height:1.2}
  .sub{color:var(--dim);font-size:15px;margin:0 0 30px;line-height:1.5}
  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .consent{display:flex;align-items:flex-start;gap:11px;margin:4px 0 2px;
    font-family:inherit;font-size:13px;letter-spacing:normal;text-transform:none;
    color:var(--dim);line-height:1.45;cursor:pointer}
  .consent + .consent{margin-top:14px}
  .consent a{color:var(--accentHi);text-decoration:underline}
  input[type=checkbox]{width:19px;height:19px;flex:0 0 auto;margin:1px 0 0;padding:0;
    background:none;border:0;border-radius:0;accent-color:var(--accent);cursor:pointer}
  .field{margin-bottom:18px}
  input{width:100%;background:var(--surface);border:1px solid var(--line);
    color:var(--text);font-size:16px;border-radius:14px;padding:15px 16px;outline:none}
  input:focus{border-color:var(--lineStrong)}
  input::placeholder{color:var(--faint)}
  button{width:100%;margin-top:10px;background:var(--text);color:#111;
    border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:600;
    cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  /* "Sending…" spinner: text stays in the DOM (for layout/accessibility) but
     goes transparent, and a spinning ring overlays it. */
  button{position:relative}
  button.sending{color:transparent}
  button.sending::after{
    content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;
    margin:-10px 0 0 -10px;border:2px solid rgba(17,17,17,.25);
    border-top-color:#111;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .msg{margin-top:18px;font-size:14px;line-height:1.5;display:none}
  .msg.err{display:block;color:var(--danger)}
  .foot{margin-top:auto;padding-top:36px;color:var(--faint);
    font-family:var(--mono);font-size:11px;letter-spacing:.25em;text-transform:uppercase}
  /* success state: fades/lifts in once "show" (display) + "in" (transition
     trigger) are both applied — see the double rAF in the submit handler. */
  .done{display:none;text-align:center;padding-top:40px;
    opacity:0;transform:translateY(10px);
    transition:opacity .45s ease, transform .45s ease}
  .done.show{display:block}
  .done.show.in{opacity:1;transform:translateY(0)}
  .tick{width:66px;height:66px;border-radius:50%;margin:0 auto 22px;
    border:1px solid var(--success);display:flex;align-items:center;justify-content:center;
    color:var(--success);font-size:30px;
    transform:scale(.4);opacity:0;
    transition:transform .4s cubic-bezier(.34,1.56,.64,1) .1s, opacity .3s ease .1s}
  .done.in .tick{transform:scale(1);opacity:1}
  .center{display:flex;flex:1;align-items:center;justify-content:center;color:var(--dim);
    text-align:center;padding:0 10px}
  .profileLink{display:none;align-items:center;gap:6px;font-size:13px;
    color:var(--accentHi);text-decoration:none;margin:-4px 0 22px}
  .profileLink.show{display:inline-flex}
</style>
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="brand">Tapliy</a>

    <!-- loading / error state -->
    <div id="loading" class="center">Loading…</div>

    <!-- form -->
    <form id="form" style="display:none">
      <div class="eyebrow">Connect with</div>
      <h1 id="profileName">a Tapliy member</h1>
      <a id="profileLink" class="profileLink" href="#" target="_self">View <span id="profileLinkName">their</span> profile ↗</a>
      <p class="sub">Share your details and <span id="ownerFirst">they</span> will have your contact instantly. Nothing is shared publicly.</p>

      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" autocomplete="name" placeholder="Your full name" required />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" type="tel" autocomplete="tel" placeholder="+65 …" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>

      <label class="consent">
        <input id="terms" type="checkbox" required />
        <span>I agree to Tapliy's <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Privacy Policy</a> (PDPA).</span>
      </label>

      <label class="consent">
        <input id="consent" type="checkbox" />
        <span>Allow my data to be kept for promotional and marketing purposes.</span>
      </label>

      <button id="submit" type="submit">Share my details</button>
      <div id="err" class="msg"></div>
    </form>

    <!-- success -->
    <div id="done" class="done">
      <div class="tick">✓</div>
      <h1>You're connected</h1>
      <p class="sub" id="doneSub">Your details were sent. Enjoy the event.</p>
    </div>

    <div class="foot">Powered by Tapliy</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // --- Supabase (public anon key — safe to ship; RLS + RPCs protect data) ---
    const SUPABASE_URL  = "https://idoxkgzcamqvknnbnbbp.supabase.co";
    const SUPABASE_ANON  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlkb3hrZ3pjYW1xdmtubmJuYmJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NDY0ODUsImV4cCI6MjEwMjEyMjQ4NX0.AD-viN1J9hM9sG0a4Mq8DNcO5YqhMhFhIrOmcHFcEU0";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const username = (params.get("u") || "").trim();

    function fatal(text){
      $("loading").style.display = "flex";
      $("form").style.display = "none";
      $("loading").textContent = text;
    }

    async function init(){
      if(!username){ fatal("This link is missing a profile."); return; }
      const { data, error } = await sb.rpc("get_public_profile", { p_username: username });
      if(error || !data || !data.length){ fatal("Sorry — this profile wasn't found."); return; }
      const profile = data[0];
      const first = (profile.full_name || "").trim().split(/\s+/)[0] || "they";
      $("profileName").textContent = profile.full_name || "a Tapliy member";
      $("ownerFirst").textContent = first;

      // Send the visitor back to the profile page they came from, same
      // "jump straight to each other" pattern as card.html's profileLink.
      $("profileLinkName").textContent = first;
      $("profileLink").href = "profile.html?u=" + encodeURIComponent(username);
      $("profileLink").classList.add("show");

      $("loading").style.display = "none";
      $("form").style.display = "block";
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = $("name").value.trim();
      if(!name){ return; }
      $("submit").disabled = true;
      $("submit").textContent = "Sending…";
      $("submit").classList.add("sending");
      $("err").className = "msg";
      const { error } = await sb.rpc("submit_profile_contact", {
        p_username: username,
        p_name: name,
        p_phone: $("phone").value.trim() || null,
        p_email: $("email").value.trim() || null,
        p_consent: $("consent").checked,
        p_terms_accepted: $("terms").checked,
      });
      if(error){
        $("err").textContent = "Something went wrong. Please try again.";
        $("err").className = "msg err";
        $("submit").disabled = false;
        $("submit").classList.remove("sending");
        $("submit").textContent = "Share my details";
        return;
      }
      $("form").style.display = "none";
      $("done").classList.add("show");
      const who = $("profileName").textContent;
      $("doneSub").textContent = who ? ("Your details were sent to " + who + ". Taking you back to their profile…") : "Your details were sent.";
      // Double rAF: let the browser paint display:block first, then trigger
      // the opacity/transform transition on the next frame — a single rAF
      // can still land before that first paint in some browsers.
      requestAnimationFrame(() => requestAnimationFrame(() => $("done").classList.add("in")));

      // Give them a moment to see the confirmation, then send them back to
      // the profile page they came from — same page the "Connect" button on
      // profile.html originally sent them out from.
      setTimeout(() => {
        window.location.href = "profile.html?u=" + encodeURIComponent(username);
      }, 1800);
    });

    init();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tapliy — Payment received</title>
<!--
  Stripe Checkout's success_url points here (see create-checkout-session),
  with ?u=<username> appended. The stripe-webhook function usually flips
  is_paid to true within a few seconds of this page loading, so we just
  poll get_public_profile briefly rather than sending the customer to a
  profile link that might 404 for a moment.
-->
<style>
  :root{
    --bg:#0A0A0B; --text:#F4F3EF; --dim:#8B8B92; --faint:#5A5A60;
    --line:rgba(255,255,255,.08); --lineStrong:rgba(255,255,255,.16);
    --accentHi:#E7C983; --success:#5BC08C; --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 40px) 22px 40px;
    display:flex;flex-direction:column;text-align:center}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.35em;
    color:var(--faint);text-transform:uppercase;text-decoration:none;display:inline-block}
  .center{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center}
  .tick{width:66px;height:66px;border-radius:50%;margin:0 0 22px;
    border:1px solid var(--success);display:flex;align-items:center;justify-content:center;
    color:var(--success);font-size:30px}
  h1{font-size:24px;font-weight:600;margin:0 0 10px}
  .sub{color:var(--dim);font-size:15px;line-height:1.6;margin:0 0 28px;max-width:340px}
  .btn{display:inline-block;background:var(--text);color:#111;text-decoration:none;
    border-radius:14px;padding:15px 28px;font-size:15px;font-weight:600}
  .foot{margin-top:auto;padding-top:36px;color:var(--faint);
    font-family:var(--mono);font-size:11px;letter-spacing:.25em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="brand">Tapliy</a>
    <div class="center">
      <div class="tick">✓</div>
      <h1>Payment received</h1>
      <p class="sub" id="sub">Setting up your profile — this usually takes a few seconds…</p>
      <a class="btn" id="link" href="#" style="display:none">View my profile</a>
    </div>
    <div class="foot">Powered by Tapliy</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL  = "https://idoxkgzcamqvknnbnbbp.supabase.co";
    const SUPABASE_ANON  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlkb3hrZ3pjYW1xdmtubmJuYmJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NDY0ODUsImV4cCI6MjEwMjEyMjQ4NX0.AD-viN1J9hM9sG0a4Mq8DNcO5YqhMhFhIrOmcHFcEU0";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const params = new URLSearchParams(location.search);
    const username = (params.get("u") || "").trim();
    const profileUrl = username ? ("profile.html?u=" + encodeURIComponent(username)) : "profile.html";

    async function poll(attempt){
      if(!username){
        document.getElementById("sub").textContent = "Your profile is being set up.";
        return;
      }
      const { data } = await sb.rpc("get_public_profile", { p_username: username });
      if(data && data.length){
        document.getElementById("sub").textContent = "Your profile is live.";
        const link = document.getElementById("link");
        link.href = profileUrl;
        link.style.display = "inline-block";
        return;
      }
      if(attempt >= 8){
        document.getElementById("sub").textContent = "Almost there — if this takes more than a minute, check back at your link shortly.";
        const link = document.getElementById("link");
        link.href = profileUrl;
        link.textContent = "Try my profile";
        link.style.display = "inline-block";
        return;
      }
      setTimeout(() => poll(attempt + 1), 1500);
    }

    poll(0);
  </script>
</body>
</html>

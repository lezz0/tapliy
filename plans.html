<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tapliy — Plans</title>
<!--
  ============================================================================
  Tapliy — plans / pricing page
  ============================================================================
  Tapliy-only page (not part of the legacy tapd1.1 site). Pick a plan +
  billing period here, then "Choose this plan" sends you to
  waitlist.html?plan=<id>&billing=<monthly|annual> -- Tapliy is in early
  access, so this no longer goes straight to order.html/Stripe checkout.
  That flow is untouched and fully working; flipping the button hrefs back
  to order.html is the whole "go live" step whenever early access ends.
  Forwards a `ref` param through unchanged, if this page was reached via a
  cardholder's lead-discount email (so the waitlist signup keeps that
  attribution).

  Prices are real (given by the business owner), not placeholders -- see
  supabase/plans.sql for the record and supabase/functions/
  create-checkout-session for where they're actually charged.
  ============================================================================
-->
<style>
  :root{
    --bg:#0A0A0B; --surface:#131316; --elevated:#1B1B1F;
    --text:#F4F3EF; --dim:#8B8B92; --faint:#5A5A60;
    --line:rgba(255,255,255,.08); --lineStrong:rgba(255,255,255,.16);
    --accent:#CBA45C; --accentHi:#E7C983; --danger:#E5574B; --success:#5BC08C;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 40px) 22px 40px;
    display:flex;flex-direction:column}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.35em;
    color:var(--faint);text-transform:uppercase}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;
    color:var(--accent);text-transform:uppercase;margin:34px 0 10px}
  h1{font-size:26px;font-weight:600;margin:0 0 6px;line-height:1.2}
  .sub{color:var(--dim);font-size:15px;margin:0 0 26px;line-height:1.5}

  .toggle{display:flex;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:4px;margin-bottom:28px}
  .toggle button{flex:1;background:none;border:none;color:var(--dim);
    font-size:14px;font-weight:600;padding:11px 8px;border-radius:11px;
    cursor:pointer;font-family:inherit}
  .toggle button.active{background:var(--text);color:#111}
  .save{font-size:11px;font-weight:600;color:var(--success);margin-left:5px}
  .toggle button.active .save{color:#1a6b45}

  .plan{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:24px;margin-bottom:16px}
  .plan.featured{border-color:var(--accent);background:var(--elevated)}
  .plan-name{font-size:18px;font-weight:700;margin:0 0 4px}
  .plan-badge{display:inline-block;font-family:var(--mono);font-size:10px;
    letter-spacing:.15em;text-transform:uppercase;color:var(--bg);
    background:var(--accentHi);border-radius:6px;padding:3px 8px;margin-bottom:8px}
  .plan-price{display:flex;align-items:baseline;gap:6px;margin:10px 0 4px}
  .plan-price .amount{font-size:32px;font-weight:700}
  .plan-price .period{color:var(--dim);font-size:14px}
  .plan-billed{color:var(--faint);font-size:12.5px;margin:0 0 18px}
  .plan-desc{color:var(--dim);font-size:14px;line-height:1.5;margin:0 0 16px}
  .features{list-style:none;margin:0 0 20px;padding:0;display:flex;
    flex-direction:column;gap:9px}
  .features li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;
    color:var(--text);line-height:1.4}
  .features li::before{content:"✓";color:var(--accent);font-weight:700;flex:0 0 auto}
  .plan-btn{display:block;width:100%;text-align:center;background:var(--text);
    color:#111;border:none;border-radius:12px;padding:14px;font-size:15px;
    font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit}
  .plan.featured .plan-btn{background:var(--accentHi)}

  .foot{margin-top:auto;padding-top:36px;color:var(--faint);
    font-family:var(--mono);font-size:11px;letter-spacing:.25em;
    text-transform:uppercase;text-align:center}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Tapliy</div>

    <div class="eyebrow">Get your card</div>
    <h1>Choose your plan</h1>
    <p class="sub">Every plan includes your personal profile website and access to the Tapliy app. Pick a card tier below.</p>

    <div class="toggle">
      <button id="btnMonthly" type="button" class="active">Monthly</button>
      <button id="btnAnnual" type="button">Annual <span class="save">Save ~17%</span></button>
    </div>

    <div id="plans"></div>

    <div class="foot">Powered by Tapliy</div>
  </div>

  <script>
    // Keep in sync with supabase/functions/create-checkout-session's PLANS table --
    // that's the source of truth for what's actually charged. This is display only.
    const PLANS = [
      {
        id: "basic",
        name: "Basic",
        desc: "Plastic card with a printed design (no laser engraving).",
        monthly: 399,
        annual: 3999,
        features: [
          "Plastic NFC card, printed design",
          "Your personal profile website",
          "Access to the Tapliy app",
        ],
      },
      {
        id: "professional",
        name: "Professional",
        badge: "Most popular",
        featured: true,
        desc: "Metal card with your name and title laser-engraved.",
        monthly: 599,
        annual: 5999,
        features: [
          "Metal NFC card",
          "Name + title laser engraving",
          "Your personal profile website",
          "Access to the Tapliy app",
        ],
      },
      {
        id: "premium",
        name: "Premium",
        desc: "Metal card, laser-engraved, with extra customization.",
        monthly: 999,
        annual: 9900,
        features: [
          "Metal NFC card",
          "Name + title laser engraving",
          "Additional customizable card + website perks",
          "Access to the Tapliy app",
        ],
      },
    ];

    const $ = (id) => document.getElementById(id);
    let billing = "monthly";
    const ref = new URLSearchParams(location.search).get("ref");
    const refParam = ref ? `&ref=${encodeURIComponent(ref)}` : "";

    function money(cents){
      return "S$" + (cents / 100).toFixed(2).replace(/\.00$/, "");
    }

    function render(){
      const container = $("plans");
      container.innerHTML = "";
      PLANS.forEach((plan) => {
        const price = billing === "monthly" ? plan.monthly : plan.annual;
        const period = billing === "monthly" ? "/mo" : "/yr";
        const billedNote = billing === "monthly" ? "billed monthly" : "billed annually";

        const el = document.createElement("div");
        el.className = "plan" + (plan.featured ? " featured" : "");
        el.innerHTML =
          (plan.badge ? `<span class="plan-badge">${plan.badge}</span>` : "") +
          `<h2 class="plan-name">${plan.name}</h2>` +
          `<div class="plan-price"><span class="amount">${money(price)}</span><span class="period">${period}</span></div>` +
          `<p class="plan-billed">${billedNote}${plan.id === "premium" ? " + prevailing taxes" : ""}</p>` +
          `<p class="plan-desc">${plan.desc}</p>` +
          `<ul class="features">${plan.features.map((f) => `<li>${f}</li>`).join("")}</ul>` +
          `<a class="plan-btn" href="waitlist.html?plan=${plan.id}&billing=${billing}${refParam}">Choose ${plan.name}</a>`;
        container.appendChild(el);
      });
    }

    $("btnMonthly").addEventListener("click", () => {
      billing = "monthly";
      $("btnMonthly").classList.add("active");
      $("btnAnnual").classList.remove("active");
      render();
    });
    $("btnAnnual").addEventListener("click", () => {
      billing = "annual";
      $("btnAnnual").classList.add("active");
      $("btnMonthly").classList.remove("active");
      render();
    });

    render();
  </script>
</body>
</html>
